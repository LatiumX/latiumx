# Cloudflare Pages project config. Pages reads this file when the project is connected to Git.
name = "latiumx"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

[vars]
# Comma-separated wallets that can use the admin page. Set your own wallet here or in the Pages dashboard.
ADMIN_WALLETS = "EgG34ZjyE3jvnc5BwaB8pVE7rSBXGJLADstGxhe2dhya"
# Escrow stays off while ESCROW_PROGRAM_ID is empty. See docs/ESCROW.md before turning it on.
ESCROW_PROGRAM_ID = ""
SOLANA_CLUSTER = "devnet"
SOLANA_PUBLIC_RPC = ""
ESCROW_MINTS = "[]"
# SOLANA_RPC (with an API key) goes in the Pages dashboard as an encrypted secret, not here.

[[d1_databases]]
binding = "DB"
database_name = "latiumx"
database_id = "2e651e04-cd6b-4e74-96a9-b664fd15baf8"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "latiumx-images"
